<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DYZ Toolbox</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
background:#0f172a;
color:white;
padding:30px;
}

.logo{
font-size:42px;
font-weight:bold;
text-align:center;
margin-top:40px;
}

.sub{
text-align:center;
color:#94a3b8;
margin-top:10px;
margin-bottom:40px;
}

.search{
width:100%;
padding:18px;
border-radius:14px;
border:none;
font-size:18px;
margin-bottom:30px;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

.card{
background:#1e293b;
padding:25px;
border-radius:18px;
text-align:center;
transition:.3s;
}

.card:hover{
transform:translateY(-4px);
background:#334155;
}

.icon{
font-size:34px;
margin-bottom:10px;
}
</style>

</head>

<body>

<div class="logo">
DYZ Toolbox
</div>

<div class="sub">
属于自己的工具网站
</div>

<input class="search" placeholder="搜索工具...">

<div class="grid">

<div class="card">
<div class="icon">🤖</div>
AI工具
</div>

<div class="card">
<div class="icon">🖼️</div>
图片工具
</div>

<div class="card">
<div class="icon">📄</div>
文件工具
</div>

<div class="card">
<div class="icon">⚙️</div>
更多工具
</div>

</div>

</body>
</html>
